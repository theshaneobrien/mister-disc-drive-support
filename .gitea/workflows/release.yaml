# Build the physcd MiSTer binary and attach it to a Gitea release.
#
# Mirrors the scriobh android.yml release pattern (same Gitea instance):
# the built-in GITHUB_TOKEN with contents:write does the release, and
# REGISTRY_TOKEN is the fallback. A downloadable binary belongs on the
# Releases page, same as scriobh attaches its APK there.
#
# Lives on the `physcd` branch because that is where the Main_MiSTer
# source is (the root repo's `main` branch gitignores it).
#
# Prereq: an act_runner online whose default image has git + node (a
# catthehacker/ubuntu:act-* image), same as the runner scriobh uses.
#
# Trigger: push a tag like v1.0.0 (builds + attaches to the release), or
# run by hand from the Actions tab (builds only, nothing to attach).

name: build-release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # the release attach needs repo-contents write
    steps:
      - uses: actions/checkout@v4

      - name: Install the ARM toolchain and build deps
        run: |
          set -eu
          # sudo if the runner user is non-root; harmless no-op if it runs as root
          SUDO=$(command -v sudo || true)
          $SUDO apt-get update
          $SUDO apt-get install -y --no-install-recommends \
            wget xz-utils make rsync ca-certificates
          # same toolchain the local docker build and upstream use
          GCC_VER=10.2-2020.11
          wget -q --no-check-certificate \
            "https://developer.arm.com/-/media/Files/downloads/gnu-a/${GCC_VER}/binrel/gcc-arm-${GCC_VER}-x86_64-arm-none-linux-gnueabihf.tar.xz" \
            -O /tmp/gcc.tar.xz
          $SUDO mkdir -p /opt/toolchain
          $SUDO tar xf /tmp/gcc.tar.xz -C /opt/toolchain --strip-components=1
          echo "/opt/toolchain/bin" >> "$GITHUB_PATH"

      - name: Build MiSTer
        run: |
          set -eu
          arm-none-linux-gnueabihf-gcc --version | head -1
          make -j"$(nproc)"
          ls -l bin/MiSTer bin/MiSTer.elf

      - name: Attach MiSTer to the Gitea release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          # prefer the auto Actions token (has contents:write via permissions
          # above); fall back to REGISTRY_TOKEN, exactly as scriobh does
          TOKEN: ${{ secrets.GITHUB_TOKEN || secrets.REGISTRY_TOKEN }}
        run: |
          set -eu
          TAG="${GITHUB_REF_NAME}"
          API="${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}"
          # a semver prerelease tag (has a hyphen, e.g. v0.2.0-beta1) is a beta
          case "$TAG" in *-*) PRE=true;; *) PRE=false;; esac
          # find the release for this tag, or create one
          REL=$(curl -s -H "Authorization: token $TOKEN" "$API/releases/tags/$TAG")
          ID=$(printf '%s' "$REL" | grep -o '"id":[0-9]*' | head -1 | cut -d: -f2 || true)
          if [ -z "$ID" ]; then
            ID=$(curl -s -X POST -H "Authorization: token $TOKEN" -H "Content-Type: application/json" \
              -d "{\"tag_name\":\"$TAG\",\"name\":\"physcd MiSTer $TAG\",\"prerelease\":$PRE}" "$API/releases" \
              | grep -o '"id":[0-9]*' | head -1 | cut -d: -f2 || true)
          fi
          if [ -z "$ID" ]; then echo "Could not find/create a release for $TAG"; echo "$REL"; exit 1; fi
          # asset name is exactly MiSTer so it drops onto the SD card as-is
          curl -fsS -X POST -H "Authorization: token $TOKEN" \
            -F "attachment=@bin/MiSTer;type=application/octet-stream" \
            "$API/releases/$ID/assets?name=MiSTer"
          echo "Attached bin/MiSTer to release $TAG."
