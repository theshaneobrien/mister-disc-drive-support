# Build BOTH MiSTer binaries and attach them to a Gitea release.
#
# A release ships two builds: MiSTer-disc (this physcd branch, stock cores)
# and MiSTer-disc-RA (the physcd-ra branch, odelot's RA fork + physcd), plus
# MiSTer-translate-install.zip - the translation feature's SD payload from
# the wrapper main branch, laid out relative to the SD root (extract onto
# the card). Both binaries install to /media/fat/MiSTer; the download names
# keep them apart. Translation is dormant unless configured (translate.ini
# + hotkey.cfg), so one binary serves both audiences.
#
# Prereq: an act_runner online whose default image has git + node.
# Trigger: push a tag like v1.0.0 (a hyphenated tag e.g. v0.2.0-beta1 is
# marked prerelease), or run by hand from the Actions tab.

name: build-release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # the release attach needs repo-contents write
    steps:
      - name: Check out the disc build (this ref, physcd)
        uses: actions/checkout@v4
        with:
          path: disc
      - name: Check out the RA build (physcd-ra)
        uses: actions/checkout@v4
        with:
          ref: physcd-ra
          path: ra
      - name: Check out the wrapper (translate SD payload lives on main)
        uses: actions/checkout@v4
        with:
          ref: main
          path: wrapper

      - name: Install the ARM toolchain and build deps
        run: |
          set -eu
          SUDO=$(command -v sudo || true)
          $SUDO apt-get update
          $SUDO apt-get install -y --no-install-recommends \
            wget xz-utils make rsync ca-certificates zip
          GCC_VER=10.2-2020.11
          wget -q --no-check-certificate \
            "https://developer.arm.com/-/media/Files/downloads/gnu-a/${GCC_VER}/binrel/gcc-arm-${GCC_VER}-x86_64-arm-none-linux-gnueabihf.tar.xz" \
            -O /tmp/gcc.tar.xz
          $SUDO mkdir -p /opt/toolchain
          $SUDO tar xf /tmp/gcc.tar.xz -C /opt/toolchain --strip-components=1
          echo "/opt/toolchain/bin" >> "$GITHUB_PATH"

      - name: Build both binaries
        run: |
          set -eu
          arm-none-linux-gnueabihf-gcc --version | head -1
          make -C disc -j"$(nproc)"
          cp disc/bin/MiSTer MiSTer-disc
          make -C ra -j"$(nproc)"
          cp ra/bin/MiSTer MiSTer-disc-RA
          ls -l MiSTer-disc MiSTer-disc-RA

      - name: Assemble the translate SD install zip
        run: |
          set -eu
          # laid out relative to the SD ROOT: extract onto the card and
          # everything lands where the feature expects it
          mkdir -p sd/translate sd/Scripts
          cp wrapper/translate/mister/translate_daemon.py sd/translate/
          cp wrapper/translate/mister/translate_start.sh  sd/translate/
          cp wrapper/translate/mister/translate.ini       sd/translate/
          cp wrapper/translate/README.md                  sd/translate/
          cp wrapper/translate/Scripts/SetTranslateHotkey.sh sd/Scripts/
          (cd sd && zip -r ../MiSTer-translate-install.zip .)
          zip -sf MiSTer-translate-install.zip

      - name: Attach all to the Gitea release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          # prefer the auto Actions token (contents:write via permissions);
          # fall back to REGISTRY_TOKEN, same as scriobh
          TOKEN: ${{ secrets.GITHUB_TOKEN || secrets.REGISTRY_TOKEN }}
        run: |
          set -eu
          TAG="${GITHUB_REF_NAME}"
          API="${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}"
          # a semver prerelease tag (has a hyphen, e.g. v0.2.0-beta1) is a beta
          case "$TAG" in *-*) PRE=true;; *) PRE=false;; esac
          # find the release for this tag, or create one
          REL=$(curl -s -H "Authorization: token $TOKEN" "$API/releases/tags/$TAG")
          ID=$(printf '%s' "$REL" | grep -o '"id":[0-9]*' | head -1 | cut -d: -f2 || true)
          if [ -z "$ID" ]; then
            ID=$(curl -s -X POST -H "Authorization: token $TOKEN" -H "Content-Type: application/json" \
              -d "{\"tag_name\":\"$TAG\",\"name\":\"physcd MiSTer $TAG\",\"prerelease\":$PRE}" "$API/releases" \
              | grep -o '"id":[0-9]*' | head -1 | cut -d: -f2 || true)
          fi
          if [ -z "$ID" ]; then echo "Could not find/create a release for $TAG"; echo "$REL"; exit 1; fi
          curl -fsS -X POST -H "Authorization: token $TOKEN" \
            -F "attachment=@MiSTer-disc;type=application/octet-stream" \
            "$API/releases/$ID/assets?name=MiSTer-disc"
          curl -fsS -X POST -H "Authorization: token $TOKEN" \
            -F "attachment=@MiSTer-disc-RA;type=application/octet-stream" \
            "$API/releases/$ID/assets?name=MiSTer-disc-RA"
          curl -fsS -X POST -H "Authorization: token $TOKEN" \
            -F "attachment=@MiSTer-translate-install.zip;type=application/zip" \
            "$API/releases/$ID/assets?name=MiSTer-translate-install.zip"
          echo "Attached MiSTer-disc, MiSTer-disc-RA and MiSTer-translate-install.zip to release $TAG."
