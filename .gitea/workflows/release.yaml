# Build the overlay-poc binary and attach it to a Gitea release.
#
# OVERLAY-POC BRANCH VARIANT. The physcd release workflow dual-builds the
# physcd + physcd-ra branches; a tag on THIS branch must not do that - it
# would attach an RA binary that lacks the overlay verbs next to one that
# has them (the mcswap stale-asset lesson). Workflows run from the tagged
# commit's tree, so this copy only governs tags placed on overlay-poc;
# physcd tags keep the stock dual-build.
#
# Prereq: an act_runner online whose default image has git + node.
# Trigger: push a tag like v0.5.2-overlaypoc1 (hyphenated = prerelease),
# or run by hand from the Actions tab.

name: build-release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # the release attach needs repo-contents write
    steps:
      - name: Check out the overlay-poc build (this ref)
        uses: actions/checkout@v4
        with:
          path: disc

      - name: Install the ARM toolchain and build deps
        run: |
          set -eu
          SUDO=$(command -v sudo || true)
          $SUDO apt-get update
          $SUDO apt-get install -y --no-install-recommends \
            wget xz-utils make rsync ca-certificates
          GCC_VER=10.2-2020.11
          wget -q --no-check-certificate \
            "https://developer.arm.com/-/media/Files/downloads/gnu-a/${GCC_VER}/binrel/gcc-arm-${GCC_VER}-x86_64-arm-none-linux-gnueabihf.tar.xz" \
            -O /tmp/gcc.tar.xz
          $SUDO mkdir -p /opt/toolchain
          $SUDO tar xf /tmp/gcc.tar.xz -C /opt/toolchain --strip-components=1
          echo "/opt/toolchain/bin" >> "$GITHUB_PATH"

      - name: Build the binary
        run: |
          set -eu
          arm-none-linux-gnueabihf-gcc --version | head -1
          make -C disc -j"$(nproc)"
          cp disc/bin/MiSTer MiSTer-disc-overlaypoc
          ls -l MiSTer-disc-overlaypoc

      - name: Attach to the Gitea release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          # prefer the auto Actions token (contents:write via permissions);
          # fall back to REGISTRY_TOKEN, same as scriobh
          TOKEN: ${{ secrets.GITHUB_TOKEN || secrets.REGISTRY_TOKEN }}
        run: |
          set -eu
          TAG="${GITHUB_REF_NAME}"
          API="${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}"
          # a semver prerelease tag (has a hyphen, e.g. v0.2.0-beta1) is a beta
          case "$TAG" in *-*) PRE=true;; *) PRE=false;; esac
          # find the release for this tag, or create one
          REL=$(curl -s -H "Authorization: token $TOKEN" "$API/releases/tags/$TAG")
          ID=$(printf '%s' "$REL" | grep -o '"id":[0-9]*' | head -1 | cut -d: -f2 || true)
          if [ -z "$ID" ]; then
            ID=$(curl -s -X POST -H "Authorization: token $TOKEN" -H "Content-Type: application/json" \
              -d "{\"tag_name\":\"$TAG\",\"name\":\"overlay PoC $TAG\",\"prerelease\":$PRE}" "$API/releases" \
              | grep -o '"id":[0-9]*' | head -1 | cut -d: -f2 || true)
          fi
          if [ -z "$ID" ]; then echo "Could not find/create a release for $TAG"; echo "$REL"; exit 1; fi
          curl -fsS -X POST -H "Authorization: token $TOKEN" \
            -F "attachment=@MiSTer-disc-overlaypoc;type=application/octet-stream" \
            "$API/releases/$ID/assets?name=MiSTer-disc-overlaypoc"
          echo "Attached MiSTer-disc-overlaypoc to release $TAG."
